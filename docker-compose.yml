# 本地开发 PostgreSQL + pgvector（数据持久化到命名卷 kangban_pgdata）
# 密码通过同目录 .env 的 POSTGRES_PASSWORD 注入，不落库本文件
# 用法：docker compose up -d
services:
  postgres:
    container_name: kangban-pg
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kangban_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_ONLY}
      POSTGRES_DB: kangban_dev
    volumes:
      - kangban_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kangban_dev -d kangban_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kangban_pgdata:
